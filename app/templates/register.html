<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - My Blog</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>


<body>

    <nav>

        <div class="container">

            <a href="/" class="logo">
                My Blog
            </a>

            <div class="nav-links">

                <a href="/">
                    Home
                </a>

                <a href="/login">
                    Login
                </a>

                <a href="/register">
                    Register
                </a>

            </div>

        </div>

    </nav>


    <main class="container">

        <div class="form-container">

            <h1>Create Account</h1>


            <form id="registerForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >


                <button type="submit">
                    Register
                </button>

            </form>


            <p id="message"></p>

        </div>

    </main>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    document.getElementById("username").value;

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;


                const userData = {

                    username: username,

                    email: email,

                    password: password

                };


                try {

                    const response = await fetch(
                        "/auth/register",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify(userData)

                        }
                    );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.detail || "Registration failed.";

                        return;

                    }


                    message.textContent =
                        "Registration successful! Redirecting to login...";


                    setTimeout(function() {

                        window.location.href = "/login";

                    }, 1000);


                } catch (error) {

                    message.textContent =
                        "Something went wrong.";

                }

            }
        );

    </script>

</body>

</html>
