services:
  db:
    image: postgres:16
    container_name: blog_postgres
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpassword
      POSTGRES_DB: blogdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U bloguser -d blogdb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: app/DockerFile
    container_name: blog_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bloguser:blogpassword@db:5432/blogdb
      SECRET_KEY: change-this-to-a-real-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"

volumes:
  postgres_data: